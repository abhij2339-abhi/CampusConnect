<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">Campus<span>Connect</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="sell.html">Sell</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html" id="authLink" class="btn small">Login</a>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="auth-box">
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="signup">Sign up</button>
      </div>

      <!-- Login form -->
      <form id="loginForm">
        <h2>Welcome back 👋</h2>
        <p class="hint">Login karke apni listings dekho.</p>
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@mitsgwl.ac.in"></div>
        <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••"></div>
        <p class="msg" id="loginMsg"></p>
        <button class="btn full" type="submit">Login</button>
      </form>

      <!-- Signup form -->
      <form id="signupForm" style="display:none">
        <h2>Join CampusConnect 🎓</h2>
        <p class="hint">Free hai, 1 minute lagega.</p>
        <div class="field"><label>Full name</label><input type="text" id="suName" placeholder="your name"></div>
        <div class="field"><label>Email</label><input type="email" id="suEmail" placeholder="you@mitsgwl.ac.in"></div>
        <div class="field"><label>Phone / WhatsApp</label><input type="tel" id="suPhone" placeholder="98XXXXXXXX"></div>
        <div class="field"><label>Password (min 6 characters)</label><input type="password" id="suPass" placeholder="••••••"></div>
        <p class="msg" id="signupMsg"></p>
        <button class="btn full" type="submit">Create account</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
